name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: little-ghost-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_object: ${{ steps.release_tag.outputs.tag_object }}
      tag_commit: ${{ steps.release_tag.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 4.0.4
          bundler-cache: true
      - name: Verify release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          tag_object="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{tag}")"
          read -r verified reason < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '[.verification.verified, .verification.reason] | @tsv'
          )
          if [[ "$verified" != "true" ]]; then
            echo "Release tag ${RELEASE_TAG} is not verified by GitHub: ${reason}" >&2
            exit 1
          fi
          bundle exec rake release:verify
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "tag_object=${tag_object}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"
      - run: bundle exec rake test
      - run: bundle exec standardrb
      - run: bundle exec rake site:check
      - run: bundle exec rake package:check

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      id-token: write
    outputs:
      prerelease: ${{ steps.publication.outputs.prerelease }}
      version: ${{ steps.publication.outputs.version }}
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 4.0.4
          bundler-cache: true
      - name: Reverify immutable release tag
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.validate.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          remote_tag_object="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha'
          )"
          if [[ "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${RELEASE_TAG} changed after validation" >&2
            exit 1
          fi
          read -r verified reason target_type target_commit < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_tag_object}" \
              --jq '[.verification.verified, .verification.reason, .object.type, .object.sha] | @tsv'
          )
          if [[ "$verified" != "true" ]]; then
            echo "Release tag ${RELEASE_TAG} is not verified by GitHub: ${reason}" >&2
            exit 1
          fi
          if [[ "$target_type" != "commit" || "$target_commit" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "Release tag ${RELEASE_TAG} no longer points to the validated commit" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "Publish checkout does not match the validated release commit" >&2
            exit 1
          fi
      - name: Check publication state
        id: publication
        run: |
          bundle exec rake package:check
          ruby <<'RUBY'
          require_relative "lib/little_ghost/version"
          require_relative "rakelib/little_ghost_release"

          published = LittleGhostRelease.published_version?(LittleGhost::VERSION)
          prerelease = Gem::Version.new(LittleGhost::VERSION).prerelease?

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "version=#{LittleGhost::VERSION}"
            output.puts "published=#{published}"
            output.puts "prerelease=#{prerelease}"
          end
          RUBY
      - name: Publish gem
        if: steps.publication.outputs.published != 'true'
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
        env:
          LITTLEGHOST_TRUSTED_PUBLISHING: "true"
        with:
          attestations: true
      - name: Download and verify published gem
        env:
          VERSION: ${{ steps.publication.outputs.version }}
        run: |
          published_gem="$RUNNER_TEMP/little_ghost-${VERSION}.gem"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            --output "$published_gem" \
            "https://rubygems.org/downloads/little_ghost-${VERSION}.gem"
          bundle exec rake "release:verify_published[$published_gem]"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.publication.outputs.prerelease }}
          VERSION: ${{ steps.publication.outputs.version }}
        run: |
          gem_path="$RUNNER_TEMP/little_ghost-${VERSION}.gem"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$gem_path" "$gem_path.sha256" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes --fail-on-no-commits)
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            release_args+=(--notes-start-tag "$previous_tag")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "$GITHUB_REF_NAME" "$gem_path" "$gem_path.sha256" "${release_args[@]}"
      - name: Rebuild versioned documentation independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main -f expected_release="$GITHUB_REF_NAME"

  verify-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify public release surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          wait_for_content() {
            label="$1"
            url="$2"
            marker="$3"

            for attempt in $(seq 1 12); do
              if body="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url")" && grep --fixed-strings --quiet "$marker" <<<"$body"; then
                echo "Verified $label."
                return 0
              fi
              sleep 5
            done

            echo "::error::$label did not expose version $version after 12 attempts"
            return 1
          }

          wait_for_content "RubyGems" \
            "https://rubygems.org/api/v1/versions/little_ghost.json" \
            "\"number\":\"${version}\""
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets,isDraft --jq '[.isDraft, ([.assets[].name] | sort)]')"
          expected="[false,[\"little_ghost-${version}.gem\",\"little_ghost-${version}.gem.sha256\"]]"
          if [[ "$assets" != "$expected" ]]; then
            echo "::error::GitHub Release assets do not match the verified gem and checksum: $assets"
            exit 1
          fi
          echo "Verified GitHub Release assets."
