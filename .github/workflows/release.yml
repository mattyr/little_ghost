name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: little-ghost-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_object: ${{ steps.release_tag.outputs.tag_object }}
      tag_commit: ${{ steps.release_tag.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 4.0.4
          bundler-cache: true
      - name: Verify release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          tag_object="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{tag}")"
          read -r verified reason < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '[.verification.verified, .verification.reason] | @tsv'
          )
          if [[ "$verified" != "true" ]]; then
            echo "Release tag ${RELEASE_TAG} is not verified by GitHub: ${reason}" >&2
            exit 1
          fi
          bundle exec rake release:verify
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "tag_object=${tag_object}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"
      - run: bundle exec rake test
      - run: bundle exec standardrb
      - run: bundle exec rake site:check
      - run: bundle exec rake package:check
      - name: Build the versioned documentation snapshot
        run: |
          version="$(ruby -Ilib -rlittle_ghost/version -e 'print LittleGhost::VERSION')"
          DOCS_VERSION_ID="$version" DOCS_BASE_PATH="versions/$version" bundle exec rake site:build
          grep --fixed-strings --quiet "data-current-version=\"$version\"" _site/index.html
          grep --fixed-strings --quiet "data-current-version=\"$version\"" _site/docs/index.html
          tar -czf "$RUNNER_TEMP/release-documentation.tgz" -C _site .
      - name: Upload the versioned documentation snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-documentation
          path: ${{ runner.temp }}/release-documentation.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    outputs:
      prerelease: ${{ steps.publication.outputs.prerelease }}
      version: ${{ steps.publication.outputs.version }}
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 4.0.4
          bundler-cache: true
      - name: Reverify immutable release tag
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.validate.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          remote_tag_object="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha'
          )"
          if [[ "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${RELEASE_TAG} changed after validation" >&2
            exit 1
          fi
          read -r verified reason target_type target_commit < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_tag_object}" \
              --jq '[.verification.verified, .verification.reason, .object.type, .object.sha] | @tsv'
          )
          if [[ "$verified" != "true" ]]; then
            echo "Release tag ${RELEASE_TAG} is not verified by GitHub: ${reason}" >&2
            exit 1
          fi
          if [[ "$target_type" != "commit" || "$target_commit" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "Release tag ${RELEASE_TAG} no longer points to the validated commit" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "Publish checkout does not match the validated release commit" >&2
            exit 1
          fi
      - name: Check publication state
        id: publication
        run: |
          bundle exec rake package:check
          ruby <<'RUBY'
          require_relative "lib/little_ghost/version"
          require_relative "rakelib/little_ghost_release"

          published = LittleGhostRelease.published_version?(LittleGhost::VERSION)
          prerelease = Gem::Version.new(LittleGhost::VERSION).prerelease?

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "version=#{LittleGhost::VERSION}"
            output.puts "published=#{published}"
            output.puts "prerelease=#{prerelease}"
          end
          RUBY
      - name: Publish gem
        if: steps.publication.outputs.published != 'true'
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
        env:
          LITTLEGHOST_TRUSTED_PUBLISHING: "true"
        with:
          attestations: true
      - name: Download and verify published gem
        env:
          VERSION: ${{ steps.publication.outputs.version }}
        run: |
          published_gem="$RUNNER_TEMP/little_ghost-${VERSION}.gem"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            --output "$published_gem" \
            "https://rubygems.org/downloads/little_ghost-${VERSION}.gem"
          bundle exec rake "release:verify_published[$published_gem]"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.publication.outputs.prerelease }}
          VERSION: ${{ steps.publication.outputs.version }}
        run: |
          gem_path="$RUNNER_TEMP/little_ghost-${VERSION}.gem"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$gem_path" "$gem_path.sha256" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes --fail-on-no-commits)
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            release_args+=(--notes-start-tag "$previous_tag")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "$GITHUB_REF_NAME" "$gem_path" "$gem_path.sha256" "${release_args[@]}"

  publish-docs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: little-ghost-documentation-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 4.0.4
          bundler-cache: true
      - name: Require the initialized documentation archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/docs-archive" >/dev/null
      - name: Check out the documentation archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs-archive
          path: _docs_archive
          fetch-depth: 1
      - name: Download the versioned documentation snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-documentation
          path: _release_artifact
      - name: Extract the versioned documentation snapshot
        run: |
          mkdir _release_site
          tar -xzf _release_artifact/release-documentation.tgz -C _release_site
      - name: Add the stable release
        if: needs.publish.outputs.prerelease != 'true'
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: bundle exec ruby bin/docs-archive publish-release _docs_archive _release_site "$VERSION"
      - name: Verify the complete documentation archive
        run: DOCS_ARCHIVE=_docs_archive bundle exec rake site:archive_check
      - name: Save the documentation archive
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          git -C _docs_archive config user.name github-actions[bot]
          git -C _docs_archive config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C _docs_archive add --all
          if ! git -C _docs_archive diff --cached --quiet; then
            git -C _docs_archive commit -m "Publish documentation for v${VERSION}"
            git -C _docs_archive push origin HEAD:docs-archive
          fi
      - name: Prepare the Pages artifact
        run: |
          mkdir _pages
          git -C _docs_archive archive --format=tar HEAD | tar -x -C _pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages
          include-hidden-files: true
      - name: Deploy released documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-release:
    needs: [publish, publish-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify public release surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          wait_for_content() {
            label="$1"
            url="$2"
            marker="$3"

            for attempt in $(seq 1 12); do
              if body="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url")" && grep --fixed-strings --quiet "$marker" <<<"$body"; then
                echo "Verified $label."
                return 0
              fi
              sleep 5
            done

            echo "::error::$label did not expose version $version after 12 attempts"
            return 1
          }

          wait_for_content "RubyGems" \
            "https://rubygems.org/api/v1/versions/little_ghost.json" \
            "\"number\":\"${version}\""
          wait_for_content "Edge website" \
            "https://mattyr.github.io/little_ghost/" \
            'data-current-version="edge"'
          wait_for_content "Edge API documentation" \
            "https://mattyr.github.io/little_ghost/docs/" \
            'data-current-version="edge"'

          if [[ "${{ needs.publish.outputs.prerelease }}" != "true" ]]; then
            wait_for_content "versioned website" \
              "https://mattyr.github.io/little_ghost/versions/${version}/" \
              "data-current-version=\"${version}\""
            wait_for_content "versioned API documentation" \
              "https://mattyr.github.io/little_ghost/versions/${version}/docs/" \
              "data-current-version=\"${version}\""
          fi

          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets,isDraft --jq '[.isDraft, ([.assets[].name] | sort)]')"
          expected="[false,[\"little_ghost-${version}.gem\",\"little_ghost-${version}.gem.sha256\"]]"
          if [[ "$assets" != "$expected" ]]; then
            echo "::error::GitHub Release assets do not match the verified gem and checksum: $assets"
            exit 1
          fi
          echo "Verified GitHub Release assets."
