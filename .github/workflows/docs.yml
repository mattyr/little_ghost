name: Documentation

on:
  workflow_dispatch:
    inputs:
      expected_release:
        description: Release tag that must be visible before the build starts
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: little-ghost-documentation-publish
  cancel-in-progress: false

jobs:
  resolve-source:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve the newest successful main commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$WORKFLOW_RUN_SHA"
          else
            sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20" \
                --jq '.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_repository.full_name == env.GITHUB_REPOSITORY) | .head_sha' |
                head -n 1
            )"
          fi
          if [[ -z "$sha" ]]; then
            echo "No successful main CI run is available for Edge documentation" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-site:
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 4.0.4
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify the documentation edge function
        run: |
          npm ci
          npm test
      - name: Build Edge and every released documentation version
        env:
          EXPECTED_RELEASE: ${{ inputs.expected_release || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$EXPECTED_RELEASE" ]]; then
            for attempt in $(seq 1 12); do
              if gh release view "$EXPECTED_RELEASE" >/dev/null 2>&1; then
                break
              fi
              if [[ "$attempt" == "12" ]]; then
                echo "Release ${EXPECTED_RELEASE} was not visible before the documentation build" >&2
                exit 1
              fi
              sleep 5
            done
          fi
          bundle exec rake site:build_all
      - name: Package the complete site
        run: tar -czf "$RUNNER_TEMP/versioned-site.tgz" -C _site .
      - name: Upload the complete site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-documentation
          path: ${{ runner.temp }}/versioned-site.tgz
          if-no-files-found: error
          retention-days: 1

  publish-cloudflare:
    needs: [resolve-source, build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    environment:
      name: cloudflare-pages
      url: https://littleghostai.org/
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked edge tooling
        run: npm ci
      - name: Download the complete site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-documentation
          path: _candidate
      - name: Extract the complete site
        run: |
          mkdir _pages
          tar -xzf _candidate/versioned-site.tgz -C _pages
      - name: Require the current published release set and successful main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-documentation-candidate _pages "${{ needs.resolve-source.outputs.source_sha }}"
      - name: Add Cloudflare function routing
        env:
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          cp functions/_routes.json _pages/_routes.json
          jq --null-input \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg source_sha "$SOURCE_SHA" \
            '{deployment_id: $deployment_id, source_sha: $source_sha}' > _pages/deployment.json
      - name: Verify the Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          project_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/littleghostai-docs"
          project="$({
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$project_api"
          })"

          [[ "$(jq --raw-output '.result.production_branch' <<< "$project")" == "main" ]]
          jq --exit-status '.result.domains | index("littleghostai.org") != null' <<< "$project" >/dev/null

          if ! jq --exit-status \
            '.result.deployment_configs.preview.fail_open and .result.deployment_configs.production.fail_open' \
            <<< "$project" >/dev/null; then
            curl --fail --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"deployment_configs":{"preview":{"fail_open":true},"production":{"fail_open":true}}}' \
              "$project_api" >/dev/null
          fi
      - name: Deploy and verify a Cloudflare preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          preview_branch="preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          preview_url="https://${preview_branch}.littleghostai-docs.pages.dev"

          npx --no-install wrangler pages deploy _pages \
            --project-name=littleghostai-docs \
            --branch="$preview_branch" \
            --commit-hash="$SOURCE_SHA" \
            --commit-dirty=false

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$preview_url/" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Cloudflare preview did not become available" >&2
              exit 1
            fi
            sleep 5
          done

          scripts/verify-documentation-edge "$preview_url" "$SOURCE_SHA" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Reconfirm the candidate before production
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-documentation-candidate _pages "${{ needs.resolve-source.outputs.source_sha }}"
      - name: Require canonical hostname redirects
        run: scripts/verify-documentation-aliases
      - name: Deploy and verify the canonical Cloudflare site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/littleghostai-docs/deployments"
          previous_deployment="$({
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${api}?env=production&per_page=1"
          } | jq --raw-output '.result[0].id // empty')"

          npx --no-install wrangler pages deploy _pages \
            --project-name=littleghostai-docs \
            --branch=main \
            --commit-hash="$SOURCE_SHA" \
            --commit-dirty=false

          verified=false
          for attempt in $(seq 1 12); do
            if scripts/verify-documentation-edge \
              "https://littleghostai.org" \
              "$SOURCE_SHA" \
              "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; then
              verified=true
              break
            fi
            [[ "$attempt" == "12" ]] || sleep 5
          done

          if [[ "$verified" != "true" ]]; then
            if [[ -n "$previous_deployment" ]]; then
              echo "Production verification failed; rolling back to ${previous_deployment}" >&2
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "${api}/${previous_deployment}/rollback" >/dev/null
            else
              echo "Production verification failed and no earlier deployment is available" >&2
            fi
            exit 1
          fi

          scripts/verify-documentation-aliases

  publish-site:
    needs: [resolve-source, build-site, publish-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the complete site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-documentation
          path: _candidate
      - name: Extract the complete site
        run: |
          mkdir _pages
          tar -xzf _candidate/versioned-site.tgz -C _pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages
          include-hidden-files: true
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
