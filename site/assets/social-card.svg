<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>LittleGhost — Agents and agent coordination in Ruby</title>
  <desc>LittleGhost logo, home-page headline, and ghost mascot on the violet and teal background glow.</desc>
  <defs>
    <linearGradient id="background" x1="44" y1="18" x2="1150" y2="612" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0c15"></stop>
      <stop offset=".58" stop-color="#0d0e18"></stop>
      <stop offset="1" stop-color="#10131d"></stop>
    </linearGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 430 -430 0 1000 78)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9070ee" stop-opacity=".28"></stop>
      <stop offset="1" stop-color="#9070ee" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="mint-glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 300 -390 0 168 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3fbfa9" stop-opacity=".14"></stop>
      <stop offset="1" stop-color="#3fbfa9" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="ghost-body" x1="838" y1="154" x2="1015" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefa"></stop>
      <stop offset=".58" stop-color="#eee8ff"></stop>
      <stop offset="1" stop-color="#bca7ff"></stop>
    </linearGradient>
    <filter id="ghost-shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#7a5bce" flood-opacity=".42"></feDropShadow>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"></rect>
  <rect width="1200" height="630" fill="url(#violet-glow)"></rect>
  <rect width="1200" height="630" fill="url(#mint-glow)"></rect>

  <g transform="translate(72 58)">
    <path fill="#eee8ff" d="M25 0C10 0 0 12 0 27v23c0 4 4 6 7 3l6-6 6 6c3 3 9 3 12 0l6-6 6 6c3 3 7 1 7-3V27C50 12 40 0 25 0Z"></path>
    <ellipse cx="17" cy="26" rx="3.5" ry="5" fill="#171827"></ellipse>
    <ellipse cx="33" cy="26" rx="3.5" ry="5" fill="#171827"></ellipse>
    <text x="68" y="38" fill="#f7f3ed" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="-1.2">LittleGhost</text>
  </g>

  <g transform="translate(72 210)">
    <text fill="#f7f3ed" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-3.4">
      <tspan x="0" y="0">Agents and agent</tspan>
      <tspan x="0" y="80">coordination in</tspan>
      <tspan x="0" y="160">Ruby.</tspan>
    </text>
  </g>

  <g>
    <circle cx="922" cy="320" r="178" fill="none" stroke="#d9cdff" stroke-opacity=".12"></circle>
    <ellipse cx="922" cy="320" rx="260" ry="94" fill="none" stroke="#76f7d2" stroke-opacity=".16" transform="rotate(-12 922 320)"></ellipse>
    <circle cx="1081" cy="180" r="4" fill="#ff829c"></circle>
    <circle cx="1064" cy="477" r="5" fill="#76f7d2"></circle>

    <g filter="url(#ghost-shadow)">
      <path fill="url(#ghost-body)" d="M922 154C856 154 814 205 814 276v145c0 15 17 21 29 10l28-25 23 23c12 12 44 12 56 0l23-23 28 25c12 11 29 5 29-10V276c0-71-42-122-108-122Z"></path>
      <ellipse cx="882" cy="294" rx="16" ry="23" fill="#171827"></ellipse>
      <ellipse cx="962" cy="294" rx="16" ry="23" fill="#171827"></ellipse>
      <circle cx="887" cy="288" r="5" fill="#fff"></circle>
      <circle cx="967" cy="288" r="5" fill="#fff"></circle>
      <path d="M900 334c13 10 31 10 44 0" fill="none" stroke="#594b7f" stroke-linecap="round" stroke-width="7"></path>
      <ellipse cx="854" cy="330" rx="17" ry="8" fill="#ff829c" opacity=".2"></ellipse>
      <ellipse cx="990" cy="330" rx="17" ry="8" fill="#ff829c" opacity=".2"></ellipse>
    </g>

  </g>
</svg>
